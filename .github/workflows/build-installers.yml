name: Build desktop installers

# Runs when you publish a GitHub Release (attaches the installers to it),
# or manually from the Actions tab (installers appear under "Artifacts").
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Put the game inside the desktop app
        shell: bash
        run: mkdir -p desktop/game && cp web/index.html desktop/game/index.html

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then npx electron-builder --win --publish never
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Build the universal .app, ad-hoc sign it, verify, then package DMG + ZIP ourselves
            V=$(node -p "require('./package.json').version")
            npx electron-builder --mac dir --universal --publish never
            APP="dist/mac-universal/Galactic Wars.app"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Galactic-Wars-$V-mac-universal.zip"
            mkdir -p dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
            hdiutil create -volname "Galactic Wars" -srcfolder dmgroot -ov -format UDZO "dist/Galactic-Wars-$V-mac.dmg"
          else npx electron-builder --linux --publish never; fi

      - name: Upload installers (Actions artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: galactic-wars-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac*.zip
            desktop/dist/*.AppImage
          if-no-files-found: ignore

      - name: Attach installers to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac*.zip
            desktop/dist/*.AppImage
